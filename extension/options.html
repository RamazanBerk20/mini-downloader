<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title data-i18n="optionsTitle">Mini Downloader Connector Options</title>
    <link rel="icon" type="image/png" sizes="48x48" href="icons/48.png" />
    <link rel="stylesheet" href="ui.css" />
  </head>
  <body class="options">
    <main class="panel">
      <header class="options-head">
        <img class="brand-icon brand-icon-large" src="icons/96.png" alt="" />
        <div>
          <h1 data-i18n="extName">Mini Downloader Connector</h1>
          <p class="desc" data-i18n="extDescription">Catch downloads in your browser and hand them to Mini Downloader.</p>
        </div>
      </header>

      <div class="field switch-row">
        <label for="enabled" data-i18n="popupCatchDownloads">Catch downloads</label>
        <span class="switch">
          <input type="checkbox" id="enabled" />
          <span class="track"></span>
        </span>
      </div>

      <div class="field">
        <label id="minSizeLabel" for="minSize" data-i18n="optionsMinSize">Minimum file size to catch</label>
        <div class="size-input" role="group" aria-labelledby="minSizeLabel">
          <input type="number" id="minSize" min="0" step="0.1" inputmode="decimal" required />
          <select id="minSizeUnit" aria-labelledby="minSizeLabel">
            <option value="B">B</option>
            <option value="KB">KB</option>
            <option value="MB">MB</option>
            <option value="GB">GB</option>
          </select>
        </div>
        <p class="hint" data-i18n="optionsMinSizeHint">Downloads smaller than this stay in your browser. Default: 1 MB.</p>
      </div>

      <div class="field">
        <label for="disabledHosts" data-i18n="optionsDisabledHosts">Disabled sites (one hostname per line)</label>
        <textarea id="disabledHosts" class="mono" rows="5" placeholder="example.com"></textarea>
      </div>

      <div class="field">
        <label for="blacklistExts" data-i18n="optionsBlacklist">Ignored file types (comma-separated)</label>
        <input type="text" id="blacklistExts" class="mono" placeholder="zip, torrent" />
        <p class="hint" data-i18n="optionsBlacklistHint">Downloads of these types stay in the browser.</p>
      </div>

      <div class="field">
        <label for="lang" data-i18n="optionsLanguage">Language</label>
        <select id="lang"></select>
      </div>

      <div class="actions">
        <button id="save" class="btn btn-primary" data-i18n="optionsSave">Save</button>
        <span id="status" class="status" role="status"></span>
      </div>

      <div class="testrow">
        <button id="test" class="btn" data-i18n="optionsTestConnection">Test app connection</button>
        <span id="test-status" class="status" role="status"></span>
      </div>
    </main>

    <script src="background-helpers.js"></script>
    <script src="options-helpers.js"></script>
    <script src="i18n.js"></script>
    <script src="options.js"></script>
  </body>
</html>
