name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install native Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config libfontconfig1-dev libwayland-dev \
            libxkbcommon-dev libx11-dev libx11-xcb-dev libxcb1-dev \
            libxcursor-dev libxrandr-dev libxi-dev appstream desktop-file-utils \
            shellcheck aria2

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1
          components: clippy,rustfmt,llvm-tools-preview

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Unit and integration tests
        run: cargo test --workspace --locked

      - name: Real aria2 loopback tests
        run: |
          cargo test -p minidl-core --test engine_e2e --locked -- --ignored
          cargo test -p minidl-app --test controller_e2e --locked -- --ignored

      - name: Core and application coverage floor
        run: |
          cargo install cargo-llvm-cov --locked --version 0.9.0
          cargo llvm-cov clean --workspace
          cargo llvm-cov -p minidl-core -p minidl-app --locked \
            --summary-only --fail-under-lines 40 -- --include-ignored

      - name: Dependency security audit
        run: |
          cargo install cargo-audit --locked --version 0.22.2
          cargo audit

      - name: Verify dependency license bundle
        run: |
          cargo install cargo-about --locked --version 0.9.1 --features cli
          cargo about generate --workspace --locked --fail about.hbs \
            -o "$RUNNER_TEMP/THIRD_PARTY_LICENSES.txt"
          cmp THIRD_PARTY_LICENSES.txt "$RUNNER_TEMP/THIRD_PARTY_LICENSES.txt"

      - name: Validate Linux metadata and scripts
        run: |
          appstreamcli validate --pedantic --no-net \
            packaging/linux/io.minidownloader.app.metainfo.xml
          desktop-file-validate packaging/linux/io.minidownloader.app.desktop
          find scripts packaging/linux -type f -name '*.sh' -print0 | xargs -0 -n1 bash -n
          shellcheck scripts/*.sh packaging/linux/*.sh
          ./scripts/check-workflows.sh

      - name: Native release smoke build
        run: cargo build --release --locked -p minidl-native-desktop -p minidl-native-host

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1
          components: clippy,rustfmt

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Unit and integration tests
        run: cargo test --workspace --locked

      - name: Native release smoke build
        run: cargo build --release --locked -p minidl-native-desktop -p minidl-native-host

  extension:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.18.0
          cache: npm
          cache-dependency-path: tools/extension-publisher/package-lock.json
      - name: Test and package extension
        run: |
          npm ci --prefix tools/extension-publisher --ignore-scripts --no-audit --no-fund
          node scripts/audit-extension-tools.mjs
          node --check extension/background-helpers.js
          node --check extension/background.js
          node --check extension/content.js
          node --check extension/popup.js
          node --check extension/options.js
          node --test extension/tests/*.test.js
          tools/extension-publisher/node_modules/.bin/web-ext lint --source-dir extension \
            --warnings-as-errors --no-config-discovery
          ./scripts/build-extension.sh
          test "$(node -p 'require("./extension/manifest.json").version')" = \
            "$(sed -nE 's/^version = "([0-9]+\.[0-9]+\.[0-9]+)"/\1/p' Cargo.toml | head -1)"
          test "$(node -p 'require("./tools/extension-publisher/package.json").version')" = \
            "$(node -p 'require("./extension/manifest.json").version')"
