name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vX.Y.Z release tag
        required: true
        type: string
      allow_unsigned_windows:
        description: Publish Windows artifacts without Authenticode (release is visibly marked)
        required: false
        default: false
        type: boolean

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  ALLOW_UNSIGNED_WINDOWS: ${{ inputs.allow_unsigned_windows || vars.ALLOW_UNSIGNED_WINDOWS || 'false' }}

jobs:
  prepare:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate version and create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(sed -nE 's/^version = "([0-9]+\.[0-9]+\.[0-9]+)"/\1/p' Cargo.toml | head -1)
          extension_version=$(node -p 'require("./extension/manifest.json").version')
          chrome_version=$(node -p 'require("./extension/manifest.chrome.json").version')
          publisher_version=$(node -p 'require("./tools/extension-publisher/package.json").version')
          test "$RELEASE_TAG" = "v$version" || {
            echo "Tag $RELEASE_TAG does not match Cargo version v$version" >&2
            exit 1
          }
          if [[ "$extension_version" != "$version" \
            || "$chrome_version" != "$version" \
            || "$publisher_version" != "$version" ]]; then
            echo "Extension and publishing-tool versions must match Cargo version $version" >&2
            exit 1
          fi
          git tag --points-at HEAD | grep -Fx -- "$RELEASE_TAG" >/dev/null || {
            echo "$RELEASE_TAG must already identify the checked-out commit" >&2
            exit 1
          }
          target=$(git rev-parse HEAD)
          release_notes="Native low-memory desktop release. Verify downloads against SHA256SUMS."
          if [[ "$ALLOW_UNSIGNED_WINDOWS" == "true" ]]; then
            release_notes+=$'\n\n> [!WARNING]\n> The Windows app and installer in this release are not Authenticode-signed. Windows may show an Unknown publisher warning. Verify SHA256SUMS before running them.'
          fi
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            is_draft=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --json isDraft --jq .isDraft)
            test "$is_draft" = true || {
              echo "Refusing to replace an already-published release." >&2
              exit 1
            }
            # A retry must not inherit artifacts from an earlier failed run.
            gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --json assets --jq '.assets[].name' \
              | while IFS= read -r asset; do
                  test -z "$asset" || gh release delete-asset "$RELEASE_TAG" "$asset" \
                    --repo "$GITHUB_REPOSITORY" --yes
                done
          else
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$target" \
              --title "Mini Downloader $RELEASE_TAG" \
              --draft \
              --generate-notes \
              --notes "$release_notes"
          fi

  # Build jobs run third-party code (build scripts, gems, AppImage tools), so
  # they get the read-only token and hand their files over as artifacts. Only
  # `upload` and `checksums` may write to the release.
  linux:
    needs: prepare
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Install native build and packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config libfontconfig1-dev libwayland-dev \
            libxkbcommon-dev libx11-dev libx11-xcb-dev libxcb1-dev \
            libxcursor-dev libxrandr-dev libxi-dev ruby-dev rpm file \
            appstream desktop-file-utils shellcheck
          sudo gem install --no-document fpm -v 1.17.0
          curl -fsSL --retry 3 --retry-all-errors --connect-timeout 15 --max-time 600 \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/1-alpha-20251107-1/linuxdeploy-x86_64.AppImage \
            -o "$RUNNER_TEMP/linuxdeploy"
          echo "c20cd71e3a4e3b80c3483cef793cda3f4e990aca14014d23c544ca3ce1270b4d  $RUNNER_TEMP/linuxdeploy" | sha256sum -c -
          # A dated release, not `continuous`: that tag is rebuilt in place, so a
          # checksum pinned against it fails on the next upstream build.
          curl -fsSL --retry 3 --retry-all-errors --connect-timeout 15 --max-time 600 \
            https://github.com/linuxdeploy/linuxdeploy-plugin-appimage/releases/download/1-alpha-20250213-1/linuxdeploy-plugin-appimage-x86_64.AppImage \
            -o "$RUNNER_TEMP/linuxdeploy-plugin-appimage"
          echo "992d502a248e14ab185448ddf6f6e7d25558cb84d4623c354c3af350c25fccb3  $RUNNER_TEMP/linuxdeploy-plugin-appimage" | sha256sum -c -
          sudo install -m 0755 "$RUNNER_TEMP/linuxdeploy" /usr/local/bin/linuxdeploy
          sudo install -m 0755 "$RUNNER_TEMP/linuxdeploy-plugin-appimage" /usr/local/bin/linuxdeploy-plugin-appimage

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1
          components: clippy,rustfmt
      # No build cache: a release must not start from a target directory that
      # an ordinary CI run filled.

      - name: Test and audit release source
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --locked
          cargo install cargo-audit --locked --version 0.22.2
          cargo audit
          cargo install cargo-about --locked --version 0.9.1 --features cli
          cargo about generate --workspace --locked --fail about.hbs \
            -o "$RUNNER_TEMP/THIRD_PARTY_LICENSES.txt"
          cmp THIRD_PARTY_LICENSES.txt "$RUNNER_TEMP/THIRD_PARTY_LICENSES.txt"
          appstreamcli validate --pedantic --no-net \
            packaging/linux/io.minidownloader.app.metainfo.xml
          desktop-file-validate packaging/linux/io.minidownloader.app.desktop
          find scripts packaging/linux -type f -name '*.sh' -print0 \
            | xargs -0 -n1 bash -n
          shellcheck scripts/*.sh packaging/linux/*.sh
          ./scripts/check-workflows.sh

      - name: Build native Linux packages
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: ./scripts/package-linux.sh

      - name: Collect Linux packages
        run: |
          mkdir release-assets
          find dist-native -maxdepth 1 -type f -exec mv -t release-assets {} +
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-linux
          path: release-assets
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          overwrite: true

  # Windows is three jobs on three machines, so that the Authenticode key never
  # shares a machine with third-party build code. Steps of one job share a VM,
  # and a process started by a build script would simply outlive its step.
  #
  # 1. Decide whether this release is signed and publish the certificate
  #    thumbprint, which the build compiles in. Runs only this repository's
  #    script; the key is deleted before the job ends.
  windows-identity:
    needs: prepare
    runs-on: windows-2022
    outputs:
      enabled: ${{ steps.signing.outputs.enabled }}
      unsigned: ${{ steps.signing.outputs.unsigned }}
      thumbprint: ${{ steps.identity.outputs.thumbprint }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false

      - id: signing
        name: Require signing or explicit unsigned override
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $certificate = -not [string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE)
          $password = -not [string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PASSWORD)
          $allowUnsigned = $env:ALLOW_UNSIGNED_WINDOWS -eq "true"
          if ($certificate -xor $password) {
            throw "Both Authenticode signing secrets are required when either is configured."
          }
          if ($certificate -and $password) {
            "enabled=true" | Out-File `
              -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            "unsigned=false" | Out-File `
              -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          } elseif ($allowUnsigned) {
            Write-Warning "Publishing explicitly authorized unsigned Windows artifacts."
            "enabled=false" | Out-File `
              -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            "unsigned=true" | Out-File `
              -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          } else {
            throw "Public Windows releases require both Authenticode signing secrets."
          }

      - id: identity
        name: Read signing certificate thumbprint
        if: ${{ steps.signing.outputs.enabled == 'true' }}
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: ./scripts/configure-windows-signing.ps1 -ThumbprintOnly

  # 2. Test and compile. Build scripts, proc-macros and dev-dependencies run
  #    here, with no signing secret and the read-only token.
  windows-build:
    needs: windows-identity
    runs-on: windows-2022
    env:
      MINIDL_WINDOWS_CERTIFICATE_THUMBPRINT: ${{ needs.windows-identity.outputs.thumbprint }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1
      # No build cache: a release must not start from a target directory that
      # an ordinary CI run filled.

      - name: Stage aria2c and yt-dlp
        shell: pwsh
        run: |
          $stage = "dist-native\windows-stage"
          New-Item -ItemType Directory -Force $stage | Out-Null
          Invoke-WebRequest `
            -Uri "https://github.com/aria2/aria2/releases/download/release-1.37.0/aria2-1.37.0-win-64bit-build1.zip" `
            -OutFile aria2.zip `
            -TimeoutSec 600
          $ariaHash = (Get-FileHash -Algorithm SHA256 aria2.zip).Hash.ToLowerInvariant()
          if ($ariaHash -ne "67d015301eef0b612191212d564c5bb0a14b5b9c4796b76454276a4d28d9b288") {
            throw "aria2 archive checksum mismatch: $ariaHash"
          }
          Expand-Archive aria2.zip -DestinationPath aria2-tmp
          Copy-Item aria2-tmp\*\aria2c.exe "$stage\aria2c.exe"
          Copy-Item aria2-tmp\*\COPYING "$stage\LICENSE.aria2.txt"
          Copy-Item aria2-tmp\*\LICENSE.OpenSSL "$stage\NOTICE.aria2-openssl.txt"
          Invoke-WebRequest `
            -Uri "https://github.com/aria2/aria2/releases/download/release-1.37.0/aria2-1.37.0.tar.xz" `
            -OutFile "dist-native\aria2-1.37.0-source.tar.xz" `
            -TimeoutSec 600
          $ariaSourceHash = (Get-FileHash -Algorithm SHA256 `
            "dist-native\aria2-1.37.0-source.tar.xz").Hash.ToLowerInvariant()
          if ($ariaSourceHash -ne "60a420ad7085eb616cb6e2bdf0a7206d68ff3d37fb5a956dc44242eb2f79b66b") {
            throw "aria2 source checksum mismatch: $ariaSourceHash"
          }
          Invoke-WebRequest `
            -Uri "https://github.com/yt-dlp/yt-dlp/releases/download/2026.07.04/yt-dlp.exe" `
            -OutFile "$stage\yt-dlp.exe" `
            -TimeoutSec 600
          $ytDlpHash = (Get-FileHash -Algorithm SHA256 "$stage\yt-dlp.exe").Hash.ToLowerInvariant()
          if ($ytDlpHash -ne "52fe3c26dcf71fbdc85b528589020bb0b8e383155cfa81b64dd447bbe35e24b8") {
            throw "yt-dlp checksum mismatch: $ytDlpHash"
          }
          Invoke-WebRequest `
            -Uri "https://github.com/yt-dlp/yt-dlp/releases/download/2026.07.04/yt-dlp.tar.gz" `
            -OutFile "dist-native\yt-dlp-2026.07.04-source.tar.gz" `
            -TimeoutSec 600
          $ytDlpSourceHash = (Get-FileHash -Algorithm SHA256 `
            "dist-native\yt-dlp-2026.07.04-source.tar.gz").Hash.ToLowerInvariant()
          if ($ytDlpSourceHash -ne "31c32457d1a573a341bb0929386c624fe47339a5338829e6e9c9454bdfa7397a") {
            throw "yt-dlp source checksum mismatch: $ytDlpSourceHash"
          }
          New-Item -ItemType Directory -Force yt-dlp-source | Out-Null
          tar -xzf "dist-native\yt-dlp-2026.07.04-source.tar.gz" `
            -C yt-dlp-source yt-dlp/LICENSE
          if ($LASTEXITCODE -ne 0) { throw "Could not extract the yt-dlp license." }
          Copy-Item yt-dlp-source\yt-dlp\LICENSE "$stage\LICENSE.yt-dlp.txt"

      - name: Test and compile
        shell: pwsh
        run: |
          cargo test --workspace --locked
          if ($LASTEXITCODE -ne 0) { throw "cargo test failed" }
          ./scripts/package-windows.ps1 -BuildOnly

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-unsigned
          path: |
            target/release/mini-downloader.exe
            target/release/minidl-native-host.exe
            dist-native
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  # 3. Sign and package. The only job that holds the key; it compiles nothing.
  windows:
    needs: [windows-identity, windows-build]
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false
      # Restores target\release and dist-native exactly as the build left them.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-unsigned

      # Pinned by version and SHA-256 like every other tool: a package
      # manager would run its own install scripts on the machine that holds
      # the signing key.
      - name: Install NSIS
        shell: pwsh
        run: |
          # curl, not Invoke-WebRequest: SourceForge answers PowerShell's browser-like
          # user agent with an HTML download page instead of the archive.
          curl.exe --fail --location --retry 5 --retry-delay 10 --max-time 600 `
            --output nsis.zip `
            "https://downloads.sourceforge.net/project/nsis/NSIS%203/3.12/nsis-3.12.zip"
          if ($LASTEXITCODE -ne 0) { throw "NSIS download failed with exit code $LASTEXITCODE" }
          $nsisHash = (Get-FileHash -Algorithm SHA256 nsis.zip).Hash.ToLowerInvariant()
          if ($nsisHash -ne "56581f90db321581c5381193d796fffcf2d24b2f8fed2160a6c6a3baa67f2c4f") {
            throw "NSIS archive checksum mismatch: $nsisHash"
          }
          Expand-Archive nsis.zip -DestinationPath "$env:RUNNER_TEMP\nsis"
          Add-Content -LiteralPath $env:GITHUB_PATH -Value "$env:RUNNER_TEMP\nsis\nsis-3.12"

      - name: Import Authenticode certificate
        if: ${{ needs.windows-identity.outputs.enabled == 'true' }}
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: ./scripts/configure-windows-signing.ps1

      - name: Sign and package
        shell: pwsh
        run: ./scripts/package-windows.ps1 -SkipBuild

      - name: Verify Authenticode signatures
        if: ${{ needs.windows-identity.outputs.enabled == 'true' }}
        shell: pwsh
        run: |
          ./scripts/verify-windows-signatures.ps1 `
            -ArtifactDirectory dist-native `
            -StageDirectory dist-native\windows-stage

      - name: Mark unsigned Windows artifacts
        if: ${{ needs.windows-identity.outputs.unsigned == 'true' }}
        shell: pwsh
        run: |
          @"
          WARNING: UNSIGNED WINDOWS BUILD

          Mini Downloader's executables and NSIS installer in this release do
          not have an Authenticode publisher signature. Windows may display an
          Unknown publisher or SmartScreen warning. Verify these files against
          the release SHA256SUMS before running them.
          "@ | Set-Content -LiteralPath dist-native\WINDOWS-UNSIGNED.txt -Encoding utf8

      - name: Remove imported signing certificate
        if: ${{ always() && needs.windows-identity.outputs.enabled == 'true' }}
        shell: pwsh
        run: |
          if (-not [string]::IsNullOrWhiteSpace($env:MINIDL_WINDOWS_CERTIFICATE_THUMBPRINT)) {
            $path = "Cert:\CurrentUser\My\$env:MINIDL_WINDOWS_CERTIFICATE_THUMBPRINT"
            if (Test-Path -LiteralPath $path) { Remove-Item -LiteralPath $path -DeleteKey -Force }
          }

      - name: Collect Windows packages
        shell: pwsh
        run: |
          New-Item -ItemType Directory release-assets | Out-Null
          Get-ChildItem dist-native -File | Move-Item -Destination release-assets
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-windows
          path: release-assets
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          overwrite: true

  extension:
    needs: prepare
    runs-on: ubuntu-22.04
    env:
      NPM_CONFIG_AUDIT: "false"
      NPM_CONFIG_IGNORE_SCRIPTS: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.18.0
          cache: npm
          cache-dependency-path: tools/extension-publisher/package-lock.json
      - name: Install extension archive tool
        run: |
          sudo apt-get update
          sudo apt-get install -y zip
      - id: extension_version
        name: Read extension version
        run: |
          version=$(node -p 'require("./extension/manifest.json").version')
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Package browser extensions
        run: |
          npm ci --prefix tools/extension-publisher --ignore-scripts --no-audit --no-fund
          node scripts/audit-extension-tools.mjs
          node --test extension/tests/*.test.js
          tools/extension-publisher/node_modules/.bin/web-ext lint --source-dir extension \
            --warnings-as-errors --no-config-discovery
          ./scripts/build-extension.sh
          node -e "const f='dist-ext/chrome/manifest.json',m=require('./'+f);delete m.key;require('fs').writeFileSync(f,JSON.stringify(m,null,2)+'\n')"
          source_epoch=$(git log -1 --format=%ct)
          find dist-ext/firefox dist-ext/chrome -type f \
            -exec touch --date="@$source_epoch" {} +
          cd dist-ext
          (cd firefox && find . -type f -print | LC_ALL=C sort \
            | zip -Xq ../mini-downloader-firefox-${{ steps.extension_version.outputs.version }}.zip -@)
          (cd chrome && find . -type f -print | LC_ALL=C sort \
            | zip -Xq ../mini-downloader-chrome-${{ steps.extension_version.outputs.version }}.zip -@)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-extension
          path: |
            dist-ext/mini-downloader-firefox-${{ steps.extension_version.outputs.version }}.zip
            dist-ext/mini-downloader-chrome-${{ steps.extension_version.outputs.version }}.zip
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          overwrite: true

  # The one job that puts build output on the draft release. It runs no build
  # tooling: it only moves the files the jobs above produced.
  upload:
    needs: [linux, windows, extension]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: assets
          merge-multiple: true
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          while IFS= read -r -d '' artifact; do
            gh release upload "$RELEASE_TAG" "$artifact" \
              --repo "$GITHUB_REPOSITORY" --clobber
          done < <(find assets -maxdepth 1 -type f -print0)

  # Runs the npm publishing tools with the store credentials, so it too gets
  # only the read-only token.
  stores:
    needs: upload
    runs-on: ubuntu-22.04
    outputs:
      signed-xpi: ${{ steps.xpi.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.18.0
          cache: npm
          cache-dependency-path: tools/extension-publisher/package-lock.json
      - name: Install extension extraction tool
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip
      - name: Install integrity-pinned publishing tools
        run: npm ci --prefix tools/extension-publisher --ignore-scripts --no-audit --no-fund
      - id: extension_version
        name: Read extension version
        run: |
          version=$(node -p 'require("./extension/manifest.json").version')
          test "$RELEASE_TAG" = "v$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-extension
          path: dist-ext
      - name: Unpack built Firefox package
        run: |
          mkdir -p dist-ext/firefox
          unzip -q "dist-ext/mini-downloader-firefox-${{ steps.extension_version.outputs.version }}.zip" \
            -d dist-ext/firefox
      - id: publication
        name: Validate store credentials
        env:
          AMO_API_KEY: ${{ secrets.AMO_API_KEY }}
          AMO_API_SECRET: ${{ secrets.AMO_API_SECRET }}
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
          CWS_ITEM_ID: ${{ secrets.CWS_ITEM_ID }}
          CWS_PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
        run: |
          amo=false
          if [[ -n "$AMO_API_KEY" || -n "$AMO_API_SECRET" ]]; then
            [[ -n "$AMO_API_KEY" && -n "$AMO_API_SECRET" ]] || {
              echo "Both AMO credentials are required when either is configured." >&2
              exit 1
            }
            amo=true
          fi
          cws=false
          if [[ -n "$CWS_CLIENT_ID" || -n "$CWS_CLIENT_SECRET" || \
                -n "$CWS_REFRESH_TOKEN" || -n "$CWS_ITEM_ID" || \
                -n "$CWS_PUBLISHER_ID" ]]; then
            [[ -n "$CWS_CLIENT_ID" && -n "$CWS_CLIENT_SECRET" && \
               -n "$CWS_REFRESH_TOKEN" && -n "$CWS_ITEM_ID" && \
               -n "$CWS_PUBLISHER_ID" ]] || {
              echo "All Chrome Web Store credentials are required together." >&2
              exit 1
            }
            cws=true
          fi
          echo "amo=$amo" >> "$GITHUB_OUTPUT"
          echo "cws=$cws" >> "$GITHUB_OUTPUT"
      - name: Sign or submit Firefox add-on
        if: ${{ steps.publication.outputs.amo == 'true' }}
        env:
          AMO_API_KEY: ${{ secrets.AMO_API_KEY }}
          AMO_API_SECRET: ${{ secrets.AMO_API_SECRET }}
          AMO_CHANNEL: ${{ vars.AMO_CHANNEL }}
        run: |
          tools/extension-publisher/node_modules/.bin/web-ext sign \
            --source-dir dist-ext/firefox \
            --channel "${AMO_CHANNEL:-listed}" \
            --api-key "$AMO_API_KEY" \
            --api-secret "$AMO_API_SECRET" \
            --artifacts-dir web-ext-artifacts
      - name: Check unlisted signed Firefox package
        if: ${{ steps.publication.outputs.amo == 'true' && vars.AMO_CHANNEL == 'unlisted' }}
        run: |
          mapfile -d '' xpis < <(find web-ext-artifacts -maxdepth 1 -name '*.xpi' -print0)
          test "${#xpis[@]}" -eq 1 || {
            echo "Expected exactly one signed Firefox XPI." >&2
            exit 1
          }
      - id: xpi
        if: ${{ steps.publication.outputs.amo == 'true' && vars.AMO_CHANNEL == 'unlisted' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: firefox-signed
          path: web-ext-artifacts/*.xpi
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          overwrite: true
      - name: Publish Chrome extension
        if: ${{ steps.publication.outputs.cws == 'true' }}
        env:
          CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
          EXTENSION_ID: ${{ secrets.CWS_ITEM_ID }}
          PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
        run: |
          tools/extension-publisher/node_modules/.bin/chrome-webstore-upload \
            --source "dist-ext/mini-downloader-chrome-${{ steps.extension_version.outputs.version }}.zip" \
            --extension-id "$EXTENSION_ID"

  checksums:
    needs: stores
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: ${{ needs.stores.outputs.signed-xpi != '' }}
        with:
          name: firefox-signed
          path: signed
      - name: Attach unlisted signed Firefox package
        if: ${{ needs.stores.outputs.signed-xpi != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$RELEASE_TAG" signed/*.xpi \
            --repo "$GITHUB_REPOSITORY" --clobber
      - name: Compute and upload SHA256SUMS
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir assets
          cd assets
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY"
          rm -f SHA256SUMS
          version="${RELEASE_TAG#v}"
          curl -fsSL --retry 3 --retry-all-errors --connect-timeout 15 --max-time 600 \
            "https://github.com/$GITHUB_REPOSITORY/archive/refs/tags/$RELEASE_TAG.tar.gz" \
            -o source.tar.gz
          source_sum=$(sha256sum source.tar.gz | cut -d' ' -f1)
          binary_sum=$(sha256sum "Mini.Downloader_${version}_linux-x86_64.tar.gz" \
            | cut -d' ' -f1)
          {
            printf '%s  %s/archive/refs/tags/%s.tar.gz\n' \
              "$source_sum" "https://github.com/$GITHUB_REPOSITORY" "$RELEASE_TAG"
            printf '%s  %s/releases/download/%s/Mini.Downloader_%s_linux-x86_64.tar.gz\n' \
              "$binary_sum" "https://github.com/$GITHUB_REPOSITORY" \
              "$RELEASE_TAG" "$version"
          } > AUR_CHECKSUMS
          rm source.tar.gz
          checksums_file=$(mktemp)
          find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%f\0' \
            | LC_ALL=C sort -z \
            | xargs -0 sha256sum -- > "$checksums_file"
          mv "$checksums_file" SHA256SUMS
          gh release upload "$RELEASE_TAG" SHA256SUMS AUR_CHECKSUMS \
            --repo "$GITHUB_REPOSITORY" --clobber
      - name: Attest release artifacts
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: assets/*

  publish:
    needs: checksums
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false
