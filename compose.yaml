# Native Linux build + development shell.
# Build release tar:          docker compose run --rm build
# Interactive GUI via X11:   xhost +local:docker && docker compose run --rm dev
services:
  dev:
    build: .
    image: minidl-dev:ubuntu22.04-rust1.97.1
    working_dir: /app
    volumes:
      - .:/app
      - cargo-registry:/usr/local/cargo/registry
      - target-cache:/app/target
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    environment:
      - DISPLAY=${DISPLAY}
    network_mode: host
    stdin_open: true
    tty: true
    command: bash

  build:
    build: .
    image: minidl-dev:ubuntu22.04-rust1.97.1
    working_dir: /app
    volumes:
      - .:/app
      - cargo-registry:/usr/local/cargo/registry
      - target-cache:/app/target
    command: bash -lc "./scripts/package-linux.sh"

volumes:
  cargo-registry:
  target-cache:
